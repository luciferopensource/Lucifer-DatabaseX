<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa771c"/>
      <stop offset="100%" stop-color="#fdf3b0"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161622"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Database Discs -->
  <ellipse cx="32" cy="22" rx="18" ry="6" fill="none" stroke="url(#goldGradient)" stroke-width="2.2" filter="url(#glow)"/>
  <path d="M14 22 v10 c0 3.3 8 6 18 6 s18 -2.7 18 -6 v-10" fill="none" stroke="url(#goldGradient)" stroke-width="2.2"/>
  <path d="M14 32 v10 c0 3.3 8 6 18 6 s18 -2.7 18 -6 v-10" fill="none" stroke="url(#goldGradient)" stroke-width="2.2"/>
  
  <!-- Royal Diamond / Star Accent -->
  <polygon points="32,9 34,14 39,14 35,17 37,22 32,19 27,22 29,17 25,14 30,14" fill="url(#goldGradient)"/>
  
  <!-- Subtle Internal Detail -->
  <circle cx="20" cy="22" r="1.5" fill="#fdf3b0"/>
  <circle cx="20" cy="32" r="1.5" fill="#fdf3b0"/>
  <circle cx="20" cy="42" r="1.5" fill="#fdf3b0"/>
</svg>
