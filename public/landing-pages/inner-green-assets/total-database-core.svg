<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1806"/>
      <stop offset="60%" stop-color="#0c0c14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#f3e5ab"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#aa771c"/>
      <stop offset="100%" stop-color="#08080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Dimensional Grid Floor -->
  <g opacity="0.18" stroke="#d4af37" stroke-width="0.8">
    <line x1="100" y1="420" x2="700" y2="420"/>
    <line x1="150" y1="380" x2="650" y2="380"/>
    <line x1="200" y1="340" x2="600" y2="340"/>
    <line x1="400" y1="250" x2="100" y2="450"/>
    <line x1="400" y1="250" x2="250" y2="450"/>
    <line x1="400" y1="250" x2="400" y2="450"/>
    <line x1="400" y1="250" x2="550" y2="450"/>
    <line x1="400" y1="250" x2="700" y2="450"/>
  </g>

  <!-- Orbiting Data Rings -->
  <g filter="url(#glow)">
    <ellipse cx="400" cy="240" rx="300" ry="110" fill="none" stroke="url(#orbitGold)" stroke-width="2.2" opacity="0.6" transform="rotate(-22 400 240)"/>
    <ellipse cx="400" cy="240" rx="300" ry="110" fill="none" stroke="url(#orbitGold)" stroke-width="2.2" opacity="0.6" transform="rotate(28 400 240)"/>
    <circle cx="400" cy="240" r="180" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.45"/>
  </g>

  <!-- Data Stream Vectors -->
  <line x1="400" y1="50" x2="400" y2="430" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4"/>
  <line x1="120" y1="240" x2="680" y2="240" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Satellite Archive Nodes -->
  <!-- Node 1: Backup 1 -->
  <g transform="translate(190, 150)">
    <circle cx="0" cy="0" r="22" fill="#08080c" stroke="#2ecc71" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#2ecc71" filter="url(#glow)"/>
    <text x="0" y="36" text-anchor="middle" fill="#2ecc71" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">BACKUP 1</text>
    <text x="0" y="48" text-anchor="middle" fill="rgba(243,229,171,0.7)" font-family="'JetBrains Mono', monospace" font-size="9">945.67 TB</text>
  </g>

  <!-- Node 2: Backup 2 -->
  <g transform="translate(610, 160)">
    <circle cx="0" cy="0" r="22" fill="#08080c" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" filter="url(#glow)"/>
    <text x="0" y="36" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">BACKUP 2</text>
    <text x="0" y="48" text-anchor="middle" fill="rgba(243,229,171,0.7)" font-family="'JetBrains Mono', monospace" font-size="9">708.57 TB</text>
  </g>

  <!-- Node 3: Future Expansion Nodes -->
  <g transform="translate(230, 340)">
    <circle cx="0" cy="0" r="14" fill="#08080c" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="5" fill="#d4af37"/>
    <text x="0" y="24" text-anchor="middle" fill="rgba(212,175,55,0.7)" font-family="'JetBrains Mono', monospace" font-size="8">NODE 03</text>
  </g>
  <g transform="translate(570, 330)">
    <circle cx="0" cy="0" r="14" fill="#08080c" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="5" fill="#d4af37"/>
    <text x="0" y="24" text-anchor="middle" fill="rgba(212,175,55,0.7)" font-family="'JetBrains Mono', monospace" font-size="8">NODE 04</text>
  </g>

  <!-- Central Luminous Core -->
  <circle cx="400" cy="240" r="95" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="400" cy="240" r="48" fill="#ffffff" opacity="0.95"/>
  <circle cx="400" cy="240" r="30" fill="#f3e5ab"/>

  <!-- Core Core Hex Badge -->
  <polygon points="400,225 413,232 413,248 400,255 387,248 387,232" fill="#08080c" stroke="#d4af37" stroke-width="2"/>
  <circle cx="400" cy="240" r="4" fill="#d4af37"/>

  <!-- Top Title Banner -->
  <rect x="250" y="20" width="300" height="28" rx="6" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
  <text x="400" y="38" text-anchor="middle" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" letter-spacing="2">UNIFIED ARCHIVE CORE</text>

  <!-- Bottom Capacity Pill -->
  <rect x="230" y="440" width="340" height="34" rx="8" fill="rgba(8,8,12,0.85)" stroke="#d4af37" stroke-width="1.5"/>
  <text x="400" y="462" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="3">1,654.24 TB • 1.65 PB VAULT</text>
</svg>

